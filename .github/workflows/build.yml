name: Unpack ZIP and Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'exam_builder_android_project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack uploaded project ZIP
        run: |
          test -f exam_builder_android_project.zip
          mkdir -p /tmp/exam-project
          unzip -o exam_builder_android_project.zip -d /tmp/exam-project
          cp -a /tmp/exam-project/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.example --project-name exam_builder /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Patch AndroidManifest (name + storage permissions)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="منشئ الامتحانات" android:requestLegacyExternalStorage="true"|' $M
          sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <application|' $M
          cat $M

      - name: Force compileSdk 36 on all plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat > /tmp/patch.kts <<'EOT'
          subprojects {
              afterEvaluate {
                  extensions.findByName("android")?.let { ext ->
                      ext.withGroovyBuilder { "compileSdkVersion"(36) }
                  }
              }
          }

          EOT
            cat /tmp/patch.kts android/build.gradle.kts > /tmp/new.kts
            mv /tmp/new.kts android/build.gradle.kts
          else
            cat > /tmp/patch.gradle <<'EOT'
          subprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }

          EOT
            cat /tmp/patch.gradle android/build.gradle > /tmp/new.gradle
            mv /tmp/new.gradle android/build.gradle
          fi
          head -20 android/build.gradle* 

      - name: Prepare release signing (fixed key so updates install over old versions)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets are missing. Using a temporary debug key; updates will conflict with installed versions."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          python3 - <<'PY'
          import os
          kts = 'android/app/build.gradle.kts'
          grv = 'android/app/build.gradle'
          if os.path.exists(kts):
              s = open(kts).read()
              block = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            storeFile = file("release.keystore")\n'
                  '            storePassword = System.getenv("KEYSTORE_PASSWORD")\n'
                  '            keyAlias = System.getenv("KEY_ALIAS")\n'
                  '            keyPassword = System.getenv("KEY_PASSWORD")\n'
                  '        }\n'
                  '    }\n'
              )
              s = s.replace('android {\n', 'android {\n' + block, 1)
              s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
              open(kts, 'w').write(s)
          else:
              s = open(grv).read()
              block = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  '            storeFile file("release.keystore")\n'
                  '            storePassword System.getenv("KEYSTORE_PASSWORD")\n'
                  '            keyAlias System.getenv("KEY_ALIAS")\n'
                  '            keyPassword System.getenv("KEY_PASSWORD")\n'
                  '        }\n'
                  '    }\n'
              )
              s = s.replace('android {\n', 'android {\n' + block, 1)
              s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              open(grv, 'w').write(s)
          PY
          grep -n "signingConfig" android/app/build.gradle* || true

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=2.3.${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-builder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to Release (direct download, no ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          make_latest: true
          body: نسخة جديدة من منشئ الامتحانات (بناء ${{ github.run_number }}). افتح التطبيق ثم حول التطبيق ثم التحقق من التحديث.
          files: build/app/outputs/flutter-apk/app-release.apk
