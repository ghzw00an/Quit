name: Unpack ZIP and Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'exam_builder_android_project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack uploaded project ZIP
        run: |
          test -f exam_builder_android_project.zip
          mkdir -p /tmp/exam-project
          unzip -o exam_builder_android_project.zip -d /tmp/exam-project
          cp -a /tmp/exam-project/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.example --project-name exam_builder /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Patch AndroidManifest (name + storage permissions)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="منشئ الامتحانات" android:requestLegacyExternalStorage="true"|' $M
          sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <application|' $M
          cat $M

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-builder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
